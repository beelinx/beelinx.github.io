<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title id="page-title">Profile | Beelinx</title>

<!-- open connections early so fonts, icons and data arrive sooner -->
<link rel="preconnect" href="https://zjzygjflcjqvouitblne.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Syne:wght@700;800&display=swap"
      rel="stylesheet">

<!-- icons load without holding up the first paint -->
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      media="print" onload="this.media='all'">
<noscript>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</noscript>

<link rel="stylesheet"
      href="../css/styles.css">

<link rel="stylesheet"
      href="../css/profile.css">

<link rel="stylesheet"
      href="../css/social.css">

</head>

<body class="profile-page">

<!-- =========================================
     SHARED HEADER
========================================= -->

<header>
    <div id="navbar-placeholder"></div>
</header>


<main>

    <!-- =========================================
         HERO (always shown; profile.js fills it in)
         states: is-loading | is-guest | is-missing | is-view
    ========================================= -->

    <section id="profile-hero" class="profile-hero is-loading">

        <!-- kept for the script, not shown on this design -->
        <div id="profile-ghost" hidden></div>

        <!-- right: page title with the buttons under it -->
        <div class="profile-side">

            <h1 id="profile-title" class="profile-title rise" style="--d: 0">Your profile</h1>

            <div class="profile-actions">

                <a id="guest-login" class="pill" href="login.html?next=profile.html" hidden>Log in</a>

                <a id="brand-link" class="pill pill-ghost" href="brandpage-template.html" hidden>Brand page</a>

                <a id="manage-btn" class="pill" href="brand-manage.html" hidden>Brand tools</a>

                <a id="message-btn" class="pill pill-ghost pill-icon" href="chat.html"
                   aria-label="Send a message" title="Send a message" hidden>
                    <i class="far fa-comment-dots"></i>
                </a>

                <button id="follow-btn" type="button" class="pill" hidden>Follow</button>

                <button id="logout-btn" type="button" class="pill" hidden>Log out</button>

            </div>

        </div>

        <!-- left: the person -->
        <div class="profile-card rise" style="--d: 1">

            <button type="button" id="profile-avatar" class="profile-avatar" aria-label="Change profile picture"></button>
            <input type="file" id="avatar-input" accept="image/*" hidden>

            <div class="profile-info">

                <p id="profile-username" class="profile-username"></p>

                <button type="button" id="profile-kicker" class="profile-kicker profile-kicker-btn" aria-label="Change account type"></button>

                <!-- tap one to open that list -->
                <div class="profile-stats">

                    <button type="button" class="stat" data-tab="posts">
                        <strong id="count-posts">0</strong><span>posts</span>
                    </button>

                    <button type="button" class="stat" data-tab="followers">
                        <strong id="count-followers">0</strong><span>followers</span>
                    </button>

                    <button type="button" class="stat" data-tab="following">
                        <strong id="count-following">0</strong><span>following</span>
                    </button>

                </div>

                <p id="profile-bio" class="profile-bio"></p>
                <div id="bio-edit-row" class="profile-bio-row" hidden>
                    <textarea id="bio-input" class="profile-bio-edit" placeholder="Add a short about you..." maxlength="300" rows="3"></textarea>
                    <div class="profile-bio-actions">
                        <button type="button" id="bio-save" class="pill" style="padding:10px 18px">Save</button>
                        <button type="button" id="bio-cancel" class="pill pill-ghost" style="padding:10px 18px">Cancel</button>
                        <span id="bio-msg" class="profile-bio-msg"></span>
                    </div>
                </div>
                <button type="button" id="bio-edit-btn" class="pill pill-ghost" style="padding:8px 14px;font-size:10px;margin-top:8px" hidden>Edit about</button>

                <!-- brand request status (your own profile only) -->
                <p id="profile-notice" class="profile-notice" hidden></p>

            </div>

        </div>

    </section>


    <!-- =========================================
         BODY (hidden until a profile is showing)
    ========================================= -->

    <div id="profile-body" class="profile-body" hidden>

        <!-- Choose a username (only for older accounts without one) -->
        <form id="username-form" class="username-form" hidden>

            <p>Pick a username so you can comment and be found. You can't change it later.</p>

            <div class="username-row">
                <input id="username-input"
                       type="text"
                       placeholder="Choose a username"
                       autocomplete="username"
                       autocapitalize="none"
                       spellcheck="false"
                       maxlength="20">

                <button type="submit" class="pill pill-dark">Save</button>
            </div>

            <p id="username-message" class="profile-message" role="alert"></p>

        </form>


        <!-- Tabs -->
        <div class="profile-tabs" role="tablist">

            <button type="button" class="tab active" role="tab" data-tab="posts">Posts</button>
            <button type="button" class="tab" role="tab" data-tab="people" id="tab-people">People</button>
            <button type="button" class="tab" role="tab" data-tab="lists" id="tab-lists" hidden>My List</button>
            <button type="button" class="tab" role="tab" data-tab="products" id="tab-products" hidden>Products</button>

            <span class="tab-indicator" aria-hidden="true"></span>

        </div>

        <div id="profile-panel" class="profile-panel"></div>

    </div>

</main>


<p class="profile-copyright">

    © 2026 Beelinx — Fashion Worth Discovering

</p>


<!-- =========================================
     JAVASCRIPT
========================================= -->

<!-- data.js, main.js and engagement.js are not needed to show a profile.
     My List loads what it needs only when you open that tab. -->

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.4/dist/umd/supabase.js"></script>
<script defer src="../js/auth.js"></script>
<script defer src="../js/social.js"></script>
<script defer src="../js/profile.js"></script>
<script defer src="../js/navbar.js"></script>

<!-- post sheet (same as feed.html) so profile posts are tappable -->
<div id="sx-sheet" class="sx-sheet" role="dialog" aria-modal="true" hidden></div>

</body>

</html>
