<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0"/>

<meta name="description"
content="Beelinxs fashion items page
We make it easier to find the best deal without switching apps."/>

<meta name="keywords"
content="Shop, Compare, Cost"/>

<title>Beelinx | Compare prices across multiple markets</title>


<link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300&display=swap"
    rel="stylesheet">


<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css"/>


<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<link
    rel="stylesheet"
    href="../css/styles.css">

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

<nav class="navbar">


<div class="hamburger" onclick="toggleMenu()">

<i class="fas fa-bars"></i>

</div>


<div class="nav-center">

<a href="index.html" class="logo-link">

<img
    src="../beelinx_logo.png"
    alt="Beelinx Logo"
    class="logo-img">

</a>

</div>


<div class="search-container">

<input
    type="text"
    class="search-input"
    id="searchInput"
    placeholder="Search..."
    onkeyup="searchFunction()">


<label for="searchInput">

<i class="fas fa-search search-btn"></i>

</label>

</div>


</nav>


<div id="sideMenu" class="side-menu">


<div class="close-btn" onclick="closeMenu()">

<i class="fas fa-times"></i>

</div>


<a href="index.html">Home</a>

<a href="catalogue.html">Catalogue</a>

<a href="about.html">About</a>


</div>

</header>



<!-- =====================================================
     HOMEPAGE FEATURED PRODUCT CAROUSEL

     Cards are automatically generated by main.js
     using featuredProducts from products.js.
===================================================== -->

<div class="featured-section-container">

<section class="featured-product">


<div
    class="featured-track"
    id="featuredTrack">

<!--
    FEATURED CARDS ARE GENERATED AUTOMATICALLY
    FROM featuredProducts IN products.js.
-->

</div>



<!-- =================================================
     HERO CAROUSEL DOTS
===================================================== -->

<div
    class="slider-dots"
    aria-label="Featured products">

</div>


</section>

</div>



<!-- =====================================================
     HOMEPAGE PRODUCT SECTION
===================================================== -->

<h1 class="motto">

Everything in one place.

</h1>


<div
    class="products-container"
    id="products-container">

</div>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer>



<!-- =====================================================
     FULL-WIDTH SCROLLABLE BRAND AD

     Brand ads are automatically generated by main.js
     using brandAds from products.js.
===================================================== -->

<section class="brand-ad-slider" id="brandAdSlider">

<!--
    BRAND ADS ARE GENERATED AUTOMATICALLY.

    Add or remove advertisements from the
    brandAds database in products.js.
-->

</section>



<!-- =====================================================
     COPYRIGHT
===================================================== -->

<div class="copyrights-gen-home">

<p>

© 2026 Beelinx — Compare prices across markets

</p>

</div>


</footer>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js">
</script>


<!--
    products.js is loaded first because it contains
    the product, brand and advertisement databases.
-->

<script src="../js/products.js"></script>

<script src="../js/main.js"></script>

<script src="../js/home-products.js"></script>


</body>

</html>
