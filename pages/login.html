<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log In | Beelinx</title>

    <style>

        /* =========================================
           BEELINX LOGIN PAGE
        ========================================= */

        /* GLOBAL RESET */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* PAGE */

        body {
            width: 100%;
            min-height: 100vh;

            background-color: #000;
            color: #fff;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 20px;
        }


        /* LOGIN CONTAINER */

        .login-container {
            width: 100%;
            max-width: 380px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }


        /* BEELINX LOGO */

        .login-logo {
            display: block;

            width: 180px;
            max-width: 80%;
            height: auto;

            object-fit: contain;

            margin-bottom: 40px;
        }


        /* LOG IN / SIGN UP SWITCH */

        .auth-tabs {
            width: 100%;

            display: flex;

            margin-bottom: 28px;

            border-bottom: 1px solid #333;
        }

        .auth-tab {
            flex: 1;

            padding: 0 0 14px;

            background: none;
            border: none;
            border-bottom: 2px solid transparent;

            margin-bottom: -1px;

            color: #888;

            font-family: inherit;
            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition:
                color 0.2s ease,
                border-color 0.2s ease;
        }

        .auth-tab:hover {
            color: #ccc;
        }

        .auth-tab.active {
            color: #fff;
            border-bottom-color: #fff;
        }

        .auth-tab:focus-visible {
            outline: 1px solid #aaa;
            outline-offset: 4px;
        }


        /* CONTINUE WITH GOOGLE */

        .google-button {
            width: 100%;
            height: 52px;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;

            background-color: #000;
            color: #fff;

            border: 1px solid #444;
            border-radius: 5px;

            font-family: inherit;
            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition: border-color 0.2s ease;
        }

        .google-button:hover {
            border-color: #aaa;
        }

        .google-button svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }


        /* "OR" DIVIDER */

        .auth-divider {
            width: 100%;

            display: flex;
            align-items: center;
            gap: 14px;

            margin: 24px 0;

            color: #666;

            font-size: 13px;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: #333;
        }


        /* LOGIN FORM */

        .login-form {
            width: 100%;

            display: flex;
            flex-direction: column;

            gap: 20px;
        }

        .login-form [hidden] {
            display: none;
        }


        /* INPUT FIELDS */

        .login-input {
            width: 100%;
            height: 52px;

            background-color: #000;
            color: #fff;

            border: 1px solid #444;
            border-radius: 5px;

            padding: 0 16px;

            font-size: 15px;

            outline: none;

            transition: border-color 0.2s ease;
        }

        .login-input::placeholder {
            color: #888;
        }

        .login-input:focus {
            border-color: #aaa;
        }


        /* PASSWORD FIELD + SHOW / HIDE EYE */

        .password-field {
            position: relative;
            width: 100%;
        }

        .password-field .login-input {
            padding-right: 52px;
        }

        .password-toggle {
            position: absolute;
            top: 0;
            right: 0;

            width: 52px;
            height: 52px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: none;
            border: none;

            color: #888;

            cursor: pointer;

            transition: color 0.2s ease;
        }

        .password-toggle:hover,
        .password-toggle[aria-pressed="true"] {
            color: #fff;
        }

        .password-toggle svg {
            width: 20px;
            height: 20px;
        }

        .password-toggle .eye-off {
            display: none;
        }

        .password-toggle[aria-pressed="true"] .eye-on {
            display: none;
        }

        .password-toggle[aria-pressed="true"] .eye-off {
            display: block;
        }


        /* FORGOT PASSWORD */

        .forgot-password {
            align-self: flex-end;

            margin-top: -8px;

            color: #aaa;

            font-size: 13px;
            text-decoration: none;

            transition: color 0.2s ease;
        }

        .forgot-password:hover {
            color: #fff;
        }


        /* MESSAGE (errors / confirmations, filled in by the login code later) */

        .login-message {
            min-height: 0;

            color: #ccc;

            font-size: 13px;
            line-height: 1.4;
            text-align: center;
        }

        .login-message:empty {
            display: none;
        }


        /* MAIN BUTTON */

        .login-button {
            width: 100%;
            height: 52px;

            margin-top: 5px;

            background-color: #fff;
            color: #000;

            border: 1px solid #fff;
            border-radius: 5px;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition:
                background-color 0.2s ease,
                color 0.2s ease;
        }

        .login-button:hover {
            background-color: #d9d9d9;
        }


        /* MESSAGE COLOURS */

        .login-message.is-error {
            color: #ff8f8f;
        }

        .login-message.is-success {
            color: #fff;
        }


        /* HEADING + ACCOUNT PANEL (set new password / already logged in) */

        .auth-heading {
            width: 100%;

            margin-bottom: 24px;

            font-size: 18px;
            font-weight: 600;
            text-align: center;
        }

        .auth-heading small {
            display: block;

            margin-top: 8px;

            color: #888;

            font-size: 13px;
            font-weight: 400;
        }

        .account-panel {
            width: 100%;

            display: flex;
            flex-direction: column;

            gap: 16px;
        }

        .account-panel[hidden],
        .auth-heading[hidden],
        .auth-tabs[hidden],
        .google-button[hidden],
        .auth-divider[hidden],
        .login-form[hidden] {
            display: none;
        }

        a.login-button {
            display: flex;
            justify-content: center;
            align-items: center;

            text-decoration: none;
        }

        .login-button.secondary {
            background-color: #000;
            color: #fff;

            border-color: #444;
        }

        .login-button.secondary:hover {
            background-color: #000;
            border-color: #aaa;
        }

        .login-button:disabled,
        .google-button:disabled {
            opacity: 0.6;
            cursor: default;
        }


        /* USERNAME HINT + ACCOUNT TYPE PICKER */

        .field-hint {
            margin-top: -10px;

            color: #888;

            font-size: 12px;
            line-height: 1.4;
        }

        .field-hint.is-error { color: #ff8f8f; }
        .field-hint.is-ok { color: #8fdc9f; }

        .login-form .field-hint[hidden],
        .login-form .type-picker[hidden] {
            display: none;
        }

        .type-picker {
            width: 100%;

            display: flex;
            gap: 12px;
        }

        .type-option {
            flex: 1;
            position: relative;
            cursor: pointer;
        }

        .type-option input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .type-option span {
            display: flex;
            flex-direction: column;
            gap: 4px;

            height: 100%;
            padding: 12px 14px;

            border: 1px solid #444;
            border-radius: 5px;

            transition: border-color 0.2s ease;
        }

        .type-option small {
            color: #888;
            font-size: 12px;
        }

        .type-option:hover span { border-color: #aaa; }

        .type-option input:checked + span {
            border-color: #fff;
        }

        .type-option input:focus-visible + span {
            outline: 1px solid #aaa;
            outline-offset: 3px;
        }


/* =========================================
   SPLASH SCREEN
========================================= */

#splash-screen {
    position: fixed;
    inset: 0;
    z-index: 9999;

    background: #000;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    transition: opacity 0.4s ease,
                visibility 0.4s ease;
}

.splash-logo {
    width: 180px;
    max-width: 70%;
    height: auto;
    object-fit: contain;

    margin-bottom: 30px;
}

.loading-track {
    width: 150px;
    height: 2px;

    background: #333;

    overflow: hidden;
}

#loading-bar {
    width: 0;
    height: 100%;

    background: #fff;

    animation: fill-loading 0.8s ease-in-out forwards;
}

@keyframes fill-loading {
    from {
        width: 0;
    }

    to {
        width: 100%;
    }
}

/* HIDE SPLASH SCREEN */

#splash-screen.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

/* PREVENT PAGE SCROLL DURING SPLASH */

body.loading {
    overflow: hidden;
}


        /* MOBILE ADJUSTMENTS */

        @media (max-width: 480px) {

            .login-container {
                max-width: 340px;
            }

            .login-logo {
                width: 155px;
                margin-bottom: 32px;
            }

            .login-input,
            .login-button,
            .google-button {
                height: 50px;
            }

            .password-toggle {
                height: 50px;
            }

        }

    </style>

</head>


<body>

    <!-- =========================================
         BEELINX SPLASH SCREEN
    ========================================= -->

    <div id="splash-screen">

        <img
            src="../beelinx_logo.png"
            alt="Beelinx Logo"
            class="splash-logo">

        <div class="loading-track">
            <div id="loading-bar"></div>
        </div>

    </div>


    <!-- =========================================
         LOGIN / SIGN UP PAGE
    ========================================= -->

    <main class="login-container">

        <!-- BEELINX LOGO -->

        <a href="index.html" aria-label="Return to Beelinx home">

            <img
                src="../beelinx_bee.png"
                alt="Beelinx Logo"
                class="login-logo">

        </a>


        <!-- LOG IN / SIGN UP SWITCH -->

        <div class="auth-tabs" role="tablist" aria-label="Account">

            <button
                type="button"
                class="auth-tab active"
                id="tab-login"
                role="tab"
                aria-selected="true"
                data-mode="login">

                Log in

            </button>

            <button
                type="button"
                class="auth-tab"
                id="tab-signup"
                role="tab"
                aria-selected="false"
                data-mode="signup">

                Sign up

            </button>

        </div>


        <!-- HEADING (only for "set new password" and "already logged in") -->

        <h1 class="auth-heading" id="auth-heading" hidden></h1>




        <!-- FORM (used for both log in and sign up) -->

        <form class="login-form" id="auth-form">

            <!-- USERNAME + ACCOUNT TYPE (sign up only) -->

            <input
                type="text"
                class="login-input"
                id="login-username"
                name="username"
                placeholder="Choose a username"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
                minlength="3"
                maxlength="20"
                hidden
                disabled>

            <p class="field-hint" id="username-hint" hidden></p>

            <div class="type-picker" id="type-picker" role="radiogroup" aria-label="Account type" hidden>

                <label class="type-option">
                    <input type="radio" name="account_type" value="shopper" checked>
                    <span><strong>Consumer</strong><small>Discover and save fashion</small></span>
                </label>

                <label class="type-option">
                    <input type="radio" name="account_type" value="model">
                    <span><strong>Model</strong><small>Show your work and style</small></span>
                </label>

            </div>

            <div id="brand-request-fields" hidden>
                <label style="display:block;font-size:13px;color:#ccc;margin:14px 0 6px">Brand name *</label>
                <input type="text" class="login-input" id="brand-name" placeholder="e.g. Zan Studios" autocomplete="off" maxlength="60">
                <label style="display:block;font-size:13px;color:#ccc;margin:10px 0 6px">Slogan / tagline</label>
                <input type="text" class="login-input" id="brand-slogan" placeholder="Short tagline" maxlength="120">
                <label style="display:block;font-size:13px;color:#ccc;margin:10px 0 6px">Website</label>
                <input type="url" class="login-input" id="brand-website" placeholder="https://...">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
                    <input type="text" class="login-input" id="brand-instagram" placeholder="Instagram link" autocomplete="off">
                    <input type="text" class="login-input" id="brand-tiktok" placeholder="TikTok link" autocomplete="off">
                </div>
                <input type="text" class="login-input" id="brand-twitter" placeholder="X / Twitter link" autocomplete="off" style="margin-top:10px">
                <label style="display:block;font-size:13px;color:#ccc;margin:10px 0 6px">About the brand</label>
                <textarea class="login-input" id="brand-description" placeholder="Tell us about the brand..." maxlength="500" style="height:84px;padding-top:12px;resize:vertical"></textarea>
                <p class="field-hint" style="margin-top:8px">Submitted for review — you'll be notified once approved. You can skip this and request later from Brand tools on your profile.</p>
            </div>

            <label id="brand-request-toggle" class="field-hint" style="display:flex;align-items:center;gap:8px;cursor:pointer" hidden>
                <input type="checkbox" id="brand-request-check"> Request brand account
            </label>

            <p class="field-hint" id="type-note" hidden>
                Own a brand? Tick the box above and fill the brand details — you can also request later from your profile → Brand tools.
            </p>


            <!-- EMAIL -->

            <input
                type="email"
                class="login-input"
                id="login-email"
                name="email"
                placeholder="Enter email"
                autocomplete="email"
                required>


            <!-- PASSWORD -->

            <div class="password-field">

                <input
                    type="password"
                    class="login-input"
                    id="login-password"
                    name="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required>

                <button
                    type="button"
                    class="password-toggle"
                    id="password-toggle"
                    aria-label="Show password"
                    aria-pressed="false">

                    <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>

                    <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94"/>
                        <path d="M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                        <path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/>
                        <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>

                </button>

            </div>


            <!-- CONFIRM PASSWORD (sign up only) -->

            <input
                type="password"
                class="login-input"
                id="login-confirm"
                name="confirm"
                placeholder="Confirm password"
                autocomplete="new-password"
                hidden
                disabled>


            <!-- FORGOT PASSWORD (log in only) -->

            <a
                href="#"
                class="forgot-password"
                id="forgot-password">

                Forgot password?

            </a>


            <!-- MESSAGE AREA (errors and confirmations) -->

            <p class="login-message" id="login-message" role="alert"></p>


            <!-- MAIN BUTTON -->

            <button
                type="submit"
                class="login-button"
                id="submit-button">

                Log In

            </button>

        </form>


        <!-- ALREADY LOGGED IN -->

        <div class="account-panel" id="account-panel" hidden>

            <a href="profile.html" class="login-button">Go to my profile</a>

            <button type="button" class="login-button secondary" id="logout-button">Log out</button>

            <p class="login-message" id="account-message" role="status"></p>

        </div>

    </main>

<script>
    document.body.classList.add("loading");

    window.addEventListener("load", function () {

        const splash = document.getElementById("splash-screen");

        setTimeout(function () {

            splash.classList.add("hide");
            document.body.classList.remove("loading");

        }, 850);

    });
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.4/dist/umd/supabase.js"></script>

<script src="../js/auth.js"></script>

<script>
    /* =========================================
       LOG IN / SIGN UP / GOOGLE / RESET PASSWORD / LOG OUT
       Uses BeelinxAuth from ../js/auth.js
    ========================================= */

    (function () {

        var HOME = "index.html";
        var MIN_PASSWORD = 8;

        var tabsBox = document.querySelector(".auth-tabs");
        var tabs = document.querySelectorAll(".auth-tab");
        var heading = document.getElementById("auth-heading");
        var usernameInput = document.getElementById("login-username");
        var usernameHint = document.getElementById("username-hint");
        var typePicker = document.getElementById("type-picker");
        var typeNote = document.getElementById("type-note");
        var brandFields = document.getElementById("brand-request-fields");
        var brandCheck = document.getElementById("brand-request-check");
        var brandToggle = document.getElementById("brand-request-toggle");
        var form = document.getElementById("auth-form");
        var email = document.getElementById("login-email");
        var password = document.getElementById("login-password");
        var confirmInput = document.getElementById("login-confirm");
        var forgot = document.getElementById("forgot-password");
        var submitButton = document.getElementById("submit-button");
        var message = document.getElementById("login-message");
        var toggle = document.getElementById("password-toggle");
        var accountPanel = document.getElementById("account-panel");
        var accountMessage = document.getElementById("account-message");
        var logoutButton = document.getElementById("logout-button");

        var mode = "login";          // login | signup | reset | account
        var busy = false;

        var labels = {
            login: "Log In",
            signup: "Create account",
            reset: "Update password"
        };

        var Auth = window.BeelinxAuth;


        /* ---------- messages ---------- */

        function say(text, kind) {
            message.textContent = text || "";
            message.className = "login-message" + (kind ? " is-" + kind : "");
        }

        function setBusy(value) {
            busy = value;
            submitButton.disabled = value;
            if (value) {
                submitButton.textContent = "Please wait...";
            } else {
                submitButton.textContent = labels[mode] || labels.login;
            }
        }


        /* ---------- username hint ---------- */

        function hint(text, kind) {
            usernameHint.textContent = text || "";
            usernameHint.className = "field-hint" + (kind ? " is-" + kind : "");
            usernameHint.hidden = !text;
        }

        var checkTimer = null;
        var checkToken = 0;

        usernameInput.addEventListener("input", function () {

            clearTimeout(checkTimer);

            var value = Auth ? Auth.cleanUsername(usernameInput.value) : "";

            if (!value) { hint(""); return; }

            var problem = Auth && Auth.validateUsername(value);
            if (problem) { hint(problem, "error"); return; }

            hint("Checking...");
            var token = ++checkToken;

            checkTimer = setTimeout(async function () {
                var free = await Auth.usernameAvailable(value);
                if (token !== checkToken) return;
                if (free === true) hint("@" + value + " is available.", "ok");
                else if (free === false) hint("@" + value + " is already taken.", "error");
                else hint("");
            }, 400);

        });


        /* ---------- screen modes ---------- */

        function setMode(newMode, headingText, subText) {

            mode = newMode;

            var isAccount = mode === "account";
            var isReset = mode === "reset";
            var isSignup = mode === "signup";
            var isLogin = mode === "login";

            tabs.forEach(function (tab) {
                var active = tab.dataset.mode === mode;
                tab.classList.toggle("active", active);
                tab.setAttribute("aria-selected", String(active));
            });

            tabsBox.hidden = isAccount || isReset;
            form.hidden = isAccount;
            accountPanel.hidden = !isAccount;

            heading.hidden = !(isAccount || isReset);
            heading.textContent = headingText || "";
            if (subText) {
                var small = document.createElement("small");
                small.textContent = subText;
                heading.appendChild(small);
            }

            /* email is not needed when choosing a new password */
            email.hidden = isReset;
            email.disabled = isReset;
            email.required = !isReset;

            password.placeholder = isReset ? "New password" : "Enter password";
            password.autocomplete = isLogin ? "current-password" : "new-password";
            password.minLength = isLogin ? 0 : MIN_PASSWORD;

            var needConfirm = isSignup || isReset;
            confirmInput.hidden = !needConfirm;
            confirmInput.disabled = !needConfirm;
            confirmInput.required = needConfirm;
            if (!needConfirm) confirmInput.value = "";

            usernameInput.hidden = !isSignup;
            usernameInput.disabled = !isSignup;
            usernameInput.required = isSignup;
            typePicker.hidden = !isSignup;
            typeNote.hidden = !isSignup;
            brandToggle.hidden = !isSignup;
            if (!isSignup) { brandCheck.checked = false; brandFields.hidden = true; }
            if (isSignup && brandCheck.checked) brandFields.hidden = false;
            else if (isSignup) brandFields.hidden = true;
            if (!isSignup) { usernameInput.value = ""; hint(""); }

            forgot.hidden = !isLogin;

            if (labels[mode]) submitButton.textContent = labels[mode];

            document.title = (isSignup ? "Sign Up" : "Log In") + " | Beelinx";

            say("");
            accountMessage.textContent = "";
        }

        function showAccount(profile) {
            setMode("account", "You're logged in",
                profile && profile.username ? "@" + profile.username : "");
        }

        /* login.html?next=my-list.html sends people back where they came from.
           Only plain page names are accepted (no other websites). */
        function nextPage() {
            var next = new URLSearchParams(window.location.search).get("next") || "";
            return /^[a-z0-9_-]+\.html(\?[A-Za-z0-9_=&%.-]*)?$/i.test(next) ? next : HOME;
        }

        function goHome() {
            window.location.replace(nextPage());
        }


        /* ---------- tabs ---------- */

        tabs.forEach(function (tab) {
            tab.addEventListener("click", function () {
                if (busy) return;
                setMode(tab.dataset.mode);
            });
        });

        brandCheck.addEventListener("change", function () {
            brandFields.hidden = !brandCheck.checked;
        });

        /* login.html?mode=signup opens straight on sign up */
        if (new URLSearchParams(window.location.search).get("mode") === "signup") {
            setMode("signup");
        }


        /* ---------- show / hide password ---------- */

        toggle.addEventListener("click", function () {

            var show = password.type === "password";

            password.type = show ? "text" : "password";
            confirmInput.type = show ? "text" : "password";

            toggle.setAttribute("aria-pressed", String(show));
            toggle.setAttribute("aria-label", show ? "Hide password" : "Show password");

        });


        /* ---------- submit (log in / sign up / new password) ---------- */

        form.addEventListener("submit", async function (event) {

            event.preventDefault();

            if (busy) return;

            if (!Auth) {
                say("Login is unavailable right now. Please try again later.", "error");
                return;
            }

            var emailValue = email.value.trim();
            var passwordValue = password.value;

            if (mode !== "login") {
                if (passwordValue.length < MIN_PASSWORD) {
                    say("Password must be at least " + MIN_PASSWORD + " characters.", "error");
                    return;
                }
                if (passwordValue !== confirmInput.value) {
                    say("Passwords do not match.", "error");
                    return;
                }
            }

            if (mode === "signup") {
                var usernameProblem = Auth.validateUsername(usernameInput.value);
                if (usernameProblem) {
                    say(usernameProblem, "error");
                    usernameInput.focus();
                    return;
                }
            }

            say("");
            setBusy(true);

            try {

                if (mode === "login") {

                    var login = await Auth.signIn(emailValue, passwordValue);

                    if (login.error) { say(login.error, "error"); return; }

                    goHome();

                } else if (mode === "signup") {

                    var chosen = form.querySelector('input[name="account_type"]:checked');
                    var wantBrand = !!brandCheck.checked;
                    if (wantBrand) {
                        var _bn = document.getElementById("brand-name").value.trim();
                        var _ab = document.getElementById("brand-description").value.trim();
                        var _hasLink = !!(document.getElementById("brand-website").value.trim() || document.getElementById("brand-instagram").value.trim() || document.getElementById("brand-tiktok").value.trim() || document.getElementById("brand-twitter").value.trim());
                        if (!_bn) { say("Brand name is required.", "error"); document.getElementById("brand-name").focus(); setBusy(false); return; }
                        if (!_ab) { say("About is required — tell us about the brand.", "error"); document.getElementById("brand-description").focus(); setBusy(false); return; }
                        if (!_hasLink) { say("Add at least one: Website, Instagram, TikTok or X / Twitter.", "error"); setBusy(false); return; }
                    }
                var signup = await Auth.signUp(
                    emailValue,
                    passwordValue,
                    usernameInput.value,
                    chosen ? chosen.value : "shopper"
                );

                    if (signup.error) { say(signup.error, "error"); return; }

                    if (wantBrand) {
                        try {
                            var u = await Auth.getUser();
                            if (u) {
                                await Auth.client.from("brand_requests").insert({
                                    user_id: u.id,
                                    brand_name: document.getElementById("brand-name").value.trim(),
                                    slogan: document.getElementById("brand-slogan").value.trim() || null,
                                    website: document.getElementById("brand-website").value.trim() || null,
                                    instagram: document.getElementById("brand-instagram").value.trim() || null,
                                    tiktok: document.getElementById("brand-tiktok").value.trim() || null,
                                    twitter: document.getElementById("brand-twitter").value.trim() || null,
                                    description: document.getElementById("brand-description").value.trim() || null,
                                    status: "pending"
                                });
                            }
                        } catch (e) { /* request save failed but account is created */ }
                    }

                    if (signup.loggedIn) {
                        if (wantBrand) say("Account created — brand request submitted for review.", "success");
                        setTimeout(goHome, 900); return;
                    }

                    setMode("login");
                    say(wantBrand ? "Account created — brand request submitted. Check your email to confirm, then log in." : "Account created. Check your email to confirm it, then log in.", "success");

                } else if (mode === "reset") {

                    var update = await Auth.updatePassword(passwordValue);

                    if (update.error) { say(update.error, "error"); return; }

                    say("Password updated. Taking you to Beelinx...", "success");
                    setTimeout(goHome, 1200);

                }

            } catch (error) {

                console.error("Beelinx login error:", error);
                say("Something went wrong. Please try again.", "error");

            } finally {

                setBusy(false);

            }

        });


        /* ---------- forgot password ---------- */

        forgot.addEventListener("click", async function (event) {

            event.preventDefault();

            if (busy || !Auth) return;

            var emailValue = email.value.trim();

            if (!emailValue) {
                say("Enter your email above first, then tap Forgot password.", "error");
                email.focus();
                return;
            }

            setBusy(true);

            try {

                var result = await Auth.sendPasswordReset(emailValue);

                if (result.error) {
                    say(result.error, "error");
                } else {
                    say("If an account exists for that email, a reset link is on its way.", "success");
                }

            } finally {

                setBusy(false);

            }

        });


        /* ---------- log out ---------- */

        logoutButton.addEventListener("click", async function () {

            if (!Auth) return;

            logoutButton.disabled = true;

            var result = await Auth.signOut();

            logoutButton.disabled = false;

            if (result.error) {
                accountMessage.textContent = result.error;
                accountMessage.className = "login-message is-error";
                return;
            }

            setMode("login");
            say("You've been logged out.", "success");

        });


        /* ---------- when the page opens ---------- */

        if (!Auth) {
            say("Login is unavailable right now. Please try again later.", "error");
            return;
        }

        var url = window.location.href;

        /* arrived from a Google / email link? */
        var cameFromLink = /access_token=|[?&#]code=/.test(url);
        var isRecoveryLink = /type=recovery/.test(url);
        var linkError = /error_description=([^&]*)/.exec(url);

        Auth.onChange(function (event) {
            if (event === "PASSWORD_RECOVERY") {
                setMode("reset", "Choose a new password");
            }
        });

        (async function start() {

            if (isRecoveryLink) {
                setMode("reset", "Choose a new password");
                return;
            }

            if (linkError) {
                var reason = decodeURIComponent(linkError[1].replace(/\+/g, " "));
                setMode("login");
                say(/expired|invalid/i.test(reason)
                    ? "That link has expired. Please try again."
                    : reason, "error");
                return;
            }

            var user = await Auth.getUser();

            if (!user) return;

            if (cameFromLink || new URLSearchParams(window.location.search).get("next")) {
                goHome();
            } else {
                showAccount(await Auth.getProfile());
            }

        })();

    })();
</script>
