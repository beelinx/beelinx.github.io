<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Beelinx brand page">

    <meta name="keywords"
          content="Fashion, Compare, Cost">

    <title id="page-title">
        Beelinx | Brand
    </title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet"
          href="../css/styles.css">

</head>


<body>


    <!-- =========================================
         HEADER
    ========================================= -->

    <header>

        <nav class="navbar">

            <!-- Hamburger -->

            <div class="hamburger"
                 onclick="toggleMenu()">

                <i class="fas fa-bars"></i>

            </div>


            <!-- Logo -->

            <div class="nav-center">

                <a href="index.html"
                   class="logo-link">

                    <img src="../beelinx_logo.png"
                         alt="Beelinx Logo"
                         class="logo-img">

                </a>

            </div>


            <!-- Search -->

            <div class="search-container">

                <input type="text"
                       class="search-input"
                       id="searchInput"
                       placeholder="Search..."
                       onkeyup="searchFunction()">

                <label for="searchInput">

                    <i class="fas fa-search search-btn"></i>

                </label>

            </div>

        </nav>


        <!-- Side Menu -->

        <div id="sideMenu"
             class="side-menu">

            <div class="close-btn"
                 onclick="closeMenu()">

                <i class="fas fa-times"></i>

            </div>


            <a href="index.html">
                Home
            </a>

            <a href="catalogue.html">
                Catalogue
            </a>

            <a href="about.html">
                About
            </a>

        </div>

    </header>



    <!-- =========================================
         BRAND INFORMATION
    ========================================= -->

    <main>


        <img id="brand-logo"
             class="brand-product-logo"
             src=""
             alt="Brand Logo">


        <h1 id="brand-name"
            class="brand-name-h">
        </h1>



        <!-- =========================================
             PRODUCTS
        ========================================= -->

        <div id="products-container"
             class="products-container">

            <!-- Products will be generated automatically -->

        </div>


    </main>



    <!-- =========================================
         FOOTER
    ========================================= -->

    <footer>

        <section class="footer-section">


            <p class="brand-web-link">

                <a id="brand-website"
                   class="website-link"
                   href=""
                   target="_blank"
                   rel="noopener noreferrer">

                    Official Website

                </a>

            </p>


            <p class="footer-text">

                Elevate your style

            </p>



            <!-- Social Media -->

            <div id="brand-socials"
                 class="social-icons">

                <!-- Social icons generated automatically -->

            </div>



            <p class="copyrights">

                © 2026 Beelinx — Compare prices across markets

            </p>


        </section>

    </footer>



    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>

    <script src="../js/main.js"></script>

    <script src="../js/products.js"></script>

    <script src="../js/brand-page.js"></script>


</body>

</html>
