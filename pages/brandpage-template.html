<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="keywords" 
    content="fashion brands, clothing brands, Nigerian fashion, 
    African fashion, streetwear brands, fashion discovery, clothing, 
    Beelinx">

    <meta name="description" 
    content="Discover fashion brands and explore their products, 
    styles, and collections on Beelinx. Find new brands and see 
    where to shop their products.">

    <title id="page-title">
        Beelinx | Discover Brands
    </title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet"
          href="../css/styles.css">

</head>


<body class="brand-page">

<!-- =========================================
     HEADER
========================================= -->

<header>
    <div id="navbar-placeholder"></div>
</header>

    <!-- =========================================
         BRAND INFORMATION
    ========================================= -->

    <main>

        <section class="brand-hero">

            <!-- giant faint brand name (text is copied from #brand-name by the script at the bottom) -->
            <div id="brand-ghost" class="brand-ghost" aria-hidden="true"></div>

            <img id="brand-logo"
                 class="brand-product-logo brand-hero-logo"
                 src=""
                 alt="Brand Logo">

            <h1 id="brand-name"
                class="brand-name-h"></h1>

        </section>

        <!-- slogan: sits under the hero, styled like the home page motto
             (keep id="brand-slogan", brand-page.js fills it) -->
        <p id="brand-slogan" class="motto brand-slogan-line"></p>



        <!-- =========================================
             PRODUCTS
        ========================================= -->

        <div id="products-container"
             class="products-container">

            <!-- Products will be generated automatically -->

        </div>


    </main>



    <!-- =========================================
         FOOTER
    ========================================= -->

    <footer class="brand-footer">

        <section class="footer-section">

            <!-- Social Media -->

            <div id="brand-socials"
                 class="social-icons">

                <!-- Social icons generated automatically -->

            </div>

            <!-- Brand website -->

            <a id="brand-website"
               class="hero-cta"
               href=""
               target="_blank"
               rel="noopener noreferrer">
                Official Website
                <span class="hero-cta-arrow">&rarr;</span>
            </a>

            <p class="copyrights">

                    © 2026 Beelinx — Fashion Worth Discovering

            </p>

        </section>

    </footer>



    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/engagement.js"></script>
    <script src="../js/brand-page.js"></script>
    <script src="../js/navbar.js" defer></script>

    <script>
        // keeps the big faint background name in sync with the brand name
        (function () {
            var name = document.getElementById("brand-name");
            var ghost = document.getElementById("brand-ghost");
            if (!name || !ghost) return;

            function sync() { ghost.textContent = name.textContent.trim(); }

            sync();
            new MutationObserver(sync).observe(name, {
                childList: true, characterData: true, subtree: true
            });
        })();
    </script>

</body>

</html>
