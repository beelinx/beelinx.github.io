<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="keywords" 
content="fashion, clothing, fashion products, clothing brands, 
Nigerian fashion, African fashion, streetwear, fashion discovery, 
Beelinx">

<meta name="description" 
content="Discover fashion products and unique styles from clothing 
brands on Beelinx. Explore products and find out where to shop them.">

<title>Beelinx | Discover Fashion</title>


<!-- Google Fonts -->

<link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&display=swap"
    rel="stylesheet">


<!-- GLightbox -->

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">


<!-- Font Awesome -->

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<!-- Product page stylesheet -->

<link
    rel="stylesheet"
    href="../css/more-info.css">


</head>

<body>

<!-- =========================================
     HEADER
========================================= -->

<header>
    <div id="navbar-placeholder"></div>
</header>

<!-- =========================================
     PRODUCT
========================================= -->

<section class="product-stage">

<main class="product-page">


    <!-- Product image -->

    <a
        id="product-image-link"
        class="clothe-image product-media"
        href="">

        <img
            id="product-image"
            class="clothe-image"
            src=""
            alt=""
            loading="lazy">

    </a>


    <!-- Product information + comments -->

    <div class="clothe-text product-panel">


        <!-- Brand -->

        <a
            id="brand-link"
            class="panel-brand"
            href="">

            <img
                id="brand-logo"
                class="brand-product-logo"
                src=""
                alt="Brand Logo">

            <span id="brand-name-text" class="panel-brand-name"></span>

        </a>


        <!-- Product name + price -->

        <h1 class="product-title">
            <span id="product-name"></span>
        </h1>

        <span
            id="product-price"
            class="price">
        </span>


        <!-- Order + Like + Save to My List -->

        <div class="panel-actions">

            <a
                id="order-link"
                class="order-link"
                href="">

                Find Order

            </a>

            <div class="product-actions">

                <button
                    id="like-btn"
                    class="action-btn"
                    type="button"
                    aria-pressed="false">

                    <i class="fa-regular fa-heart"></i>
                    <span id="like-count"></span>

                </button>

                <button
                    id="save-btn"
                    class="action-btn"
                    type="button"
                    aria-pressed="false">

                    <i class="fa-regular fa-bookmark"></i>
                    <span id="save-label">Save to My List</span>

                </button>

            </div>

        </div>


        <!-- Comments -->

        <section class="comments-section">

            <div class="comments-head">

                <h2>
                    Comments
                    <span id="comments-count"></span>
                </h2>

                <!-- Social icons -->

                <div
                    id="brand-socials"
                    class="brand-socials">
                </div>

            </div>

            <div id="comments-list"></div>

            <form id="comment-form" class="comment-form">

                <input
                    id="comment-input"
                    type="text"
                    placeholder="Add a comment"
                    autocomplete="off"
                    aria-label="Add a comment">

                <button type="submit">Post</button>

            </form>

        </section>


    </div>

</main>

</section>



<!-- =========================================
     MORE BY BRAND
========================================= -->

<section class="more-products-section">


    <div class="more-products-header">


        <!-- Title -->

        <h2 id="more-products-title">

            More by this brand

        </h2>


    </div>


    <!-- Related products -->

    <div
        id="more-products-container"
        class="more-products-container">

        <!-- Products generated automatically -->

    </div>


</section>



<!-- =========================================
     FOOTER: SLOGAN + BRAND WEBSITE + COPYRIGHT
========================================= -->

<footer class="product-footer">

    <p
        id="productBrandSlogan"
        class="product-brand-slogan">
    </p>

    <div class="product-brand-website">

        <a
            id="productBrandWebsite"
            class="website-link"
            href="#"
            target="_blank"
            rel="noopener noreferrer">

            Official Website

        </a>

    </div>

    <div class="product-brand-copyright">

        © 2026 Beelinx. All rights reserved.

    </div>

</footer>


<!-- =========================================
     JAVASCRIPT
========================================= -->

<script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>

<script src="../js/main.js"></script>

<script src="../js/data.js"></script>

<script src="../js/more-info.js"></script>

<script src="../js/engagement.js"></script>

<script src="../js/navbar.js" defer></script>

<script>
    // shows the brand name next to the logo (read from the logo's alt text)
    (function () {
        var logo = document.getElementById("brand-logo");
        var label = document.getElementById("brand-name-text");
        if (!logo || !label) return;
        var alt = (logo.getAttribute("alt") || "").trim();
        if (alt && alt !== "Brand Logo") {
            label.textContent = alt.replace(/\s*Logo$/i, "");
        }
    })();
</script>

</body>

</html>
