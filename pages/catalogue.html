<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="description"
      content="Choose a brand to shop from in the catalogue">

<meta name="keywords"
      content="Shop, Compare, Cost, Catalogue">

<title>Beelinx | Catalogue page</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet"
      href="../css/styles.css">


</head>

<body>


<!-- =========================================
     HEADER
========================================== -->

<header>

    <nav class="navbar">

        <!-- Hamburger -->

        <div class="hamburger"
             onclick="toggleMenu()">

            <i class="fas fa-bars"></i>

        </div>


        <!-- Logo -->

        <div class="nav-center">

            <a href="index.html"
               class="logo-link">

                <img src="../beelinx_logo.png"
                     alt="Beelinx Logo"
                     class="logo-img">

            </a>

        </div>


        <!-- Search -->

        <div class="search-container">

            <input type="text"
                   class="search-input"
                   id="searchInput"
                   placeholder="Search..."
                   onkeyup="searchFunction()">

            <label for="searchInput">

                <i class="fas fa-search search-btn"></i>

            </label>

        </div>

    </nav>


    <!-- Side Menu -->

    <div id="sideMenu"
         class="side-menu">

        <div class="close-btn"
             onclick="closeMenu()">

            <i class="fas fa-times"></i>

        </div>


        <a href="index.html">
            Home
        </a>

        <a href="catalogue.html">
            Catalogue
        </a>

        <a href="about.html">
            About
        </a>

    </div>

</header>


<!-- =========================================
     CATALOGUE
========================================== -->

<h1>
    Catalogue
</h1>


<!-- Brands will be generated automatically -->

<div id="brand-section-container"
     class="brand-section-container">

</div>


<!-- =========================================
     COPYRIGHT
========================================== -->

<div class="copyrights-gen">

    <p>
        © 2026 Beelinx — Fashion Worth Discovering
    </p>

</div>


<!-- =========================================
     JAVASCRIPT
========================================== -->

<script src="../js/main.js"></script>

<script src="../js/products.js"></script>


<script>

    /* =========================================
       GENERATE BRAND CATALOGUE
    ========================================= */

    const brandContainer =
        document.getElementById(
            "brand-section-container"
        );


    if (brandContainer && typeof brands !== "undefined") {


        Object.entries(brands).forEach(
            ([brandName, brand]) => {


                /* =================================
                   CREATE BRAND CARD
                ================================= */

                const brandSection =
                    document.createElement("div");

                brandSection.className =
                    "brand-section";


                /* =================================
                   BRAND LINK
                ================================= */

                const brandLink =
                    document.createElement("a");

                brandLink.href =
                    `brandpage-template.html?brand=${encodeURIComponent(brandName)}`;


                /* =================================
                   BRAND LOGO
                ================================= */

                const logo =
                    document.createElement("img");

                logo.className =
                    "brand-logo";

                logo.src =
                    brand.logo;

                logo.alt =
                    `${brandName} Brand Logo`;

                logo.loading =
                    "lazy";


                /* Put logo inside link */

                brandLink.appendChild(logo);


                /* =================================
                   BRAND NAME
                ================================= */

                const name =
                    document.createElement("strong");

                name.textContent =
                    brandName;


                /* =================================
                   CARD CONTENT
                ================================= */

                const logoAlign =
                    document.createElement("p");

                logoAlign.className =
                    "logo-align";


                logoAlign.appendChild(
                    brandLink
                );

                logoAlign.appendChild(
                    document.createElement("br")
                );

                logoAlign.appendChild(
                    name
                );


                brandSection.appendChild(
                    logoAlign
                );


                brandContainer.appendChild(
                    brandSection
                );

            }
        );

    }

</script>


</body>

</html>
