<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="keywords" 
content="fashion catalogue, clothing catalogue, clothing brands, 
fashion brands, Nigerian fashion, African fashion, streetwear, 
fashion products, Beelinx">

<meta name="description" 
content="Browse the Beelinx fashion catalogue to discover clothing 
brands, products, and styles from different brands all in one place.">

<title>Beelinx Catalogue | Discover Fashion & Brands</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet"
      href="../css/styles.css">


</head>

<body>

<!-- =========================================
     SHARED HEADER
========================================== -->

<header>
    <div id="navbar-placeholder"></div>
</header>

<!-- =========================================
     CATALOGUE
========================================== -->

<h1>
    Catalogue
</h1>


<!-- Brands will be generated automatically -->

<div id="brand-section-container"
     class="brand-section-container">

</div>


<!-- =========================================
     COPYRIGHT
========================================== -->

<div class="copyrights-gen">

    <p>
        © 2026 Beelinx — Fashion Worth Discovering
    </p>

</div>


<!-- =========================================
     JAVASCRIPT
========================================== -->

<script src="../js/data.js"></script>
<script src="../js/main.js"></script>
<script src="../js/navbar.js"></script>

<script>

    /* =========================================
       GENERATE BRAND CATALOGUE
    ========================================= */

    const brandContainer =
        document.getElementById(
            "brand-section-container"
        );


    if (brandContainer && typeof brands !== "undefined") {


        Object.entries(brands).forEach(
            ([brandName, brand]) => {


                /* =================================
                   CREATE BRAND CARD
                ================================= */

                const brandSection =
                    document.createElement("div");

                brandSection.className =
                    "brand-section";


                /* =================================
                   BRAND LINK
                ================================= */

                const brandLink =
                    document.createElement("a");

                brandLink.href =
                    `brandpage-template.html?brand=${encodeURIComponent(brandName)}`;


                /* =================================
                   BRAND LOGO
                ================================= */

                const logo =
                    document.createElement("img");

                logo.className =
                    "brand-logo";

                logo.src =
                    brand.logo;

                logo.alt =
                    `${brandName} Brand Logo`;

                logo.loading =
                    "lazy";


                /* Put logo inside link */

                brandLink.appendChild(logo);


                /* =================================
                   BRAND NAME
                ================================= */

                const name =
                    document.createElement("strong");

                name.textContent =
                    brandName;


                /* =================================
                   CARD CONTENT
                ================================= */

                const logoAlign =
                    document.createElement("p");

                logoAlign.className =
                    "logo-align";


                logoAlign.appendChild(
                    brandLink
                );

                logoAlign.appendChild(
                    document.createElement("br")
                );

                logoAlign.appendChild(
                    name
                );


                brandSection.appendChild(
                    logoAlign
                );


                brandContainer.appendChild(
                    brandSection
                );

            }
        );

    }

</script>


</body>

</html>
