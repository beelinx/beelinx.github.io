<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beelinx Shared Navbar</title>
</head>

<body>

    <!-- =========================================
         BEELINX SHARED NAVBAR (top: logo + search)
    ========================================= -->

    <nav class="navbar">

        <!-- WORDMARK (text, no image: change the font in the css, see --brand-font) -->
        <div class="nav-center">
            <a href="index.html" class="logo-link wordmark">Beelinx</a>
        </div>

        <!-- SEARCH -->
        <div class="search-container">

            <input
                type="text"
                class="search-input"
                id="searchInput"
                placeholder="Search...">

            <label for="searchInput">
                <i class="fas fa-search search-btn"></i>
            </label>

        </div>

    </nav>


    <!-- =========================================
         NAVIGATION (replaces the old side menu)
         Phone: flat full-width bar at the bottom. It shrinks to a small
         pill while you scroll down; tap the pill (or scroll up) to bring it back.
         Computer: the same icons stacked in a slim bar on the left.
         data-label is the little tooltip on desktop,
         aria-label is for screen readers.
    ========================================= -->

    <nav class="dock" aria-label="Main">

        <a href="index.html"
           class="dock-link"
           data-label="Home"
           aria-label="Home">
            <i class="fas fa-house"></i>
        </a>

        <a href="catalogue.html"
           class="dock-link"
           data-label="Catalogue"
           aria-label="Catalogue">
            <i class="fas fa-book"></i>
        </a>

        <a href="my-list.html"
           class="dock-link"
           data-label="My List"
           aria-label="My List">
            <i class="fas fa-list"></i>
        </a>

        <a href="about.html"
           class="dock-link"
           data-label="About"
           aria-label="About">
            <i class="fas fa-circle-info"></i>
        </a>

        <a href="login.html"
           class="dock-link"
           data-label="Login"
           aria-label="Login">
            <i class="fas fa-user"></i>
        </a>

    </nav>

</body>

</html>
