<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beelinx Shared Navbar</title>
</head>

<body>

    <!-- =========================================
         BEELINX SHARED NAVBAR (top: logo + search)
    ========================================= -->

    <nav class="navbar">

        <!-- WORDMARK (text, no image: change the font in the css, see --brand-font) -->
        <div class="nav-center">

            <!-- computer only: hover or click to open the side bar (it pushes the page, it does not cover it) -->
            <button type="button"
                    id="railToggle"
                    class="rail-toggle"
                    aria-label="Open navigation"
                    aria-expanded="false"
                    aria-controls="mainDock">
                <i class="fas fa-angles-right"></i>
            </button>

            <a href="index.html" class="logo-link wordmark">Beelinx</a>

        </div>

        <!-- SEARCH -->
        <div class="search-container">

            <input
                type="text"
                class="search-input"
                id="searchInput"
                placeholder="Search...">

            <!-- X: cancels the search (clears the text, shows everything again, closes the panel) -->
            <button type="button"
                    id="searchClear"
                    class="search-clear"
                    aria-label="Cancel search">
                <i class="fas fa-xmark"></i>
            </button>

            <label for="searchInput">
                <i class="fas fa-search search-btn"></i>
            </label>

        </div>

    </nav>


    <!-- =========================================
         NAVIGATION (replaces the old side menu)
         Phone: flat full-width bar at the bottom. It shrinks to a small
         pill while you scroll down; tap the pill (or scroll up) to bring it back.
         Computer: the same icons stacked in a slim bar on the left. It is
         hidden until you hover or click the arrow next to "Beelinx" and
         it pushes the page across instead of covering it.
         data-label is the little tooltip on desktop,
         aria-label is for screen readers.
    ========================================= -->

    <nav class="dock" id="mainDock" aria-label="Main">

        <a href="index.html"
           class="dock-link"
           data-label="Home"
           aria-label="Home">
            <i class="fas fa-house"></i>
        </a>

        <a href="catalogue.html"
           class="dock-link"
           data-label="Catalogue"
           aria-label="Catalogue">
            <svg class="dock-svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <!-- three books: spine + covers (thick stroke), pages (filled bar) -->
                <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                      d="M20.1 2.5H7.8a2.4 2.4 0 0 0 0 4.8H18.9
                         M20.6 9.6H5.8a2.4 2.4 0 0 0 0 4.8H19.4
                         M20.1 16.7H7.8a2.4 2.4 0 0 0 0 4.8H18.9"/>
                <path d="M7.8 3.9h9.8a1 1 0 0 1 0 2h-9.8a1 1 0 0 1 0-2z
                         M5.8 11h12.3a1 1 0 0 1 0 2h-12.3a1 1 0 0 1 0-2z
                         M7.8 18.1h9.8a1 1 0 0 1 0 2h-9.8a1 1 0 0 1 0-2z"/>
            </svg>
        </a>

        <a href="feed.html"
           class="dock-link"
           data-label="Feed"
           aria-label="Feed">
            <svg class="dock-svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <!-- top half: avatar + two text lines are cut out (see-through) -->
                <path fill-rule="evenodd" d="M6 2h12a4 4 0 0 1 4 4v4.5H2V6a4 4 0 0 1 4-4z
                    M6.6 4.7a1.5 1.5 0 1 0 0 3a1.5 1.5 0 1 0 0-3z
                    M10.6 4.8h6.8a.6.6 0 0 1 0 1.2h-6.8a.6.6 0 0 1 0-1.2z
                    M10.6 6.7h6.8a.6.6 0 0 1 0 1.2h-6.8a.6.6 0 0 1 0-1.2z"/>
                <!-- bottom half -->
                <path d="M2 12h20v6a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z"/>
            </svg>
        </a>

        <a href="chat.html"
           class="dock-link"
           data-label="Chat"
           aria-label="Chat">
            <i class="fas fa-comment-dots"></i>
        </a>

        <a href="profile.html"
           class="dock-link"
           data-label="Profile"
           aria-label="Profile">
            <i class="fas fa-user"></i>
        </a>

        <a href="about.html"
           class="dock-link"
           data-label="About"
           aria-label="About">
            <i class="fas fa-circle-info"></i>
        </a>

        <!-- shown only when the bar has shrunk (scrolling down on a phone); tap it to bring the bar back -->
        <button type="button"
                class="dock-grip"
                aria-label="Show menu"
                tabindex="-1">
            <i class="fas fa-ellipsis"></i>
        </button>

    </nav>

</body>

</html>
