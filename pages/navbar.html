<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beelinx Shared Navbar</title>
</head>

<body>

    <!-- =========================================
         BEELINX SHARED NAVBAR (top: logo + search)
    ========================================= -->

    <nav class="navbar">

        <!-- WORDMARK (text, no image: change the font in the css, see --brand-font) -->
        <div class="nav-center">

            <!-- computer only: hover or click to open the side bar (it pushes the page, it does not cover it) -->
            <button type="button"
                    id="railToggle"
                    class="rail-toggle"
                    aria-label="Open navigation"
                    aria-expanded="false"
                    aria-controls="mainDock">
                <i class="fas fa-angles-right"></i>
            </button>

            <a href="index.html" class="logo-link wordmark">Beelinx</a>

        </div>

        <!-- SEARCH -->
        <div class="search-container">

            <input
                type="text"
                class="search-input"
                id="searchInput"
                placeholder="Search...">

            <!-- X: cancels the search (clears the text, shows everything again, closes the panel) -->
            <button type="button"
                    id="searchClear"
                    class="search-clear"
                    aria-label="Cancel search">
                <i class="fas fa-xmark"></i>
            </button>

            <label for="searchInput">
                <i class="fas fa-search search-btn"></i>
            </label>

        </div>

    </nav>


    <!-- =========================================
         NAVIGATION (replaces the old side menu)
         Phone: flat full-width bar at the bottom. It shrinks to a small
         pill while you scroll down; tap the pill (or scroll up) to bring it back.
         Computer: the same icons stacked in a slim bar on the left. It is
         hidden until you hover or click the arrow next to "Beelinx" and
         it pushes the page across instead of covering it.
         data-label is the little tooltip on desktop,
         aria-label is for screen readers.
    ========================================= -->

    <nav class="dock" id="mainDock" aria-label="Main">

        <a href="index.html"
           class="dock-link"
           data-label="Home"
           aria-label="Home">
            <i class="fas fa-house"></i>
        </a>

        <a href="catalogue.html"
           class="dock-link"
           data-label="Catalogue"
           aria-label="Catalogue">
            <i class="fas fa-book"></i>
        </a>

        <a href="feed.html"
           class="dock-link"
           data-label="Feed"
           aria-label="Feed">
            <i class="fas fa-images"></i>
        </a>

        <a href="chat.html"
           class="dock-link"
           data-label="Chat"
           aria-label="Chat">
            <i class="fas fa-comment-dots"></i>
        </a>

        <a href="profile.html"
           class="dock-link"
           data-label="Profile"
           aria-label="Profile">
            <i class="fas fa-user"></i>
        </a>

        <a href="about.html"
           class="dock-link"
           data-label="About"
           aria-label="About">
            <i class="fas fa-circle-info"></i>
        </a>

        <!-- shown only when the bar has shrunk (scrolling down on a phone); tap it to bring the bar back -->
        <button type="button"
                class="dock-grip"
                aria-label="Show menu"
                tabindex="-1">
            <i class="fas fa-ellipsis"></i>
        </button>

    </nav>

</body>

</html>
