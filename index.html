
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beelinx</title>


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: black;
        }

        .splash-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 38px;
        }

        .logo {
            width: 300px;
            max-width: 55vw;
            height: auto;
            object-fit: contain;
        }

    </style>
</head>

<body>
    <div class="splash-screen">
        <img
            src="beelinx_logo.png"
            alt="Beelinx"
            class="logo"
        >
    </div>
</body>
</html>
